<style>
/* Layout: zero-based envelope budget. Gradient "ready to assign" hero, grouped category rows with assign input and availability pill, bottom tab bar, lock screen over everything. */
:root{
  --bg:#EEF1F8; --surface:#FFFFFF; --surface2:#E6EBF6; --ink:#101830; --muted:#5A6687; --line:#D6DDEC;
  --accent:#1B3FC4; --accent-ink:#FFFFFF; --in:#0A8F7F; --out:#C22E4B; --gold:#A97F10;
  --hero-a:#1B3FC4; --hero-b:#0D8A8F; --hero-ink:#FFFFFF;
  --ok-bg:#D8F3EB; --ok-fg:#06695C; --warn-bg:#FFEFC9; --warn-fg:#7A4B00; --bad-bg:#FFDCE3; --bad-fg:#9B1C36;
  --shadow:0 1px 2px rgba(16,24,48,.05),0 8px 24px rgba(16,24,48,.07);
  --font-display:'Lalezar','Vazirmatn',Tahoma,sans-serif; --font-body:'Vazirmatn',Tahoma,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0A0F1F; --surface:#131A2F; --surface2:#1C2544; --ink:#E9EDF9; --muted:#9CA7C8; --line:#2A3558;
  --accent:#7B93FF; --accent-ink:#0A0F1F; --in:#3FD1BC; --out:#FF7C95; --gold:#E3BC4E;
  --hero-a:#5C78F5; --hero-b:#2FC4B0; --hero-ink:#07101F;
  --ok-bg:#123D36; --ok-fg:#5FE0CB; --warn-bg:#3F3213; --warn-fg:#F2C46A; --bad-bg:#45182A; --bad-fg:#FF9DB0;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A0F1F; --surface:#131A2F; --surface2:#1C2544; --ink:#E9EDF9; --muted:#9CA7C8; --line:#2A3558;
  --accent:#7B93FF; --accent-ink:#0A0F1F; --in:#3FD1BC; --out:#FF7C95; --gold:#E3BC4E;
  --hero-a:#5C78F5; --hero-b:#2FC4B0; --hero-ink:#07101F;
  --ok-bg:#123D36; --ok-fg:#5FE0CB; --warn-bg:#3F3213; --warn-fg:#F2C46A; --bad-bg:#45182A; --bad-fg:#FF9DB0;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.7;margin:0;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#app{min-height:100vh;padding-block:0 108px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));transition:filter .2s}
#app.shield{filter:blur(18px)}
.col{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:14px;padding-top:14px}
.n{direction:ltr;unicode-bidi:isolate;font-variant-numeric:tabular-nums;display:inline-block}
.muted,small{color:var(--muted)}
.hide-amt .amt{filter:blur(7px);user-select:none}
h3{margin:0 0 10px;font-size:15px;font-weight:700}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.brand{white-space:nowrap;font-family:var(--font-display);font-size:28px;line-height:1;color:var(--accent)}
.monthnav{display:flex;align-items:center;justify-content:center;gap:4px}
.monthnav .lbl{min-width:112px;text-align:center;font-weight:800}
.ibtn{border:1px solid var(--line);background:var(--surface);border-radius:12px;width:38px;height:38px;display:grid;place-items:center}
.ibtn:hover{background:var(--surface2)}
.ibtn svg,.nav svg,.fab svg{stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.ibtn svg{width:20px;height:20px}
.card{background:var(--surface);border-radius:20px;padding:16px;box-shadow:var(--shadow);min-width:0}
.hero{background:linear-gradient(135deg,var(--hero-a),var(--hero-b));color:var(--hero-ink);border-radius:24px;padding:18px;display:flex;flex-direction:column;gap:6px;box-shadow:var(--shadow)}
.hero small{color:inherit;opacity:.85}
.hero .big{font-family:var(--font-display);font-size:44px;line-height:1.15}
.hero .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.hero .btn{background:rgba(255,255,255,.22);color:inherit}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .hero .btn{background:rgba(7,16,31,.2)}}
:root[data-theme="dark"] .hero .btn{background:rgba(7,16,31,.2)}
.hero.neg{background:linear-gradient(135deg,#B3203F,#E0644F);color:#fff}
.btn{border:0;border-radius:12px;background:var(--accent);color:var(--accent-ink);padding:9px 16px;font-weight:700;white-space:nowrap}
.btn.ghost{background:var(--surface2);color:var(--ink)}
.btn.danger{background:var(--out);color:#fff}
.btn.sm{padding:4px 12px;font-size:13px;border-radius:9px}
input[type=text],input[type=password],input[type=number],select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:9px 12px;width:100%;min-width:0}
textarea{min-height:100px;direction:ltr;font-family:monospace;font-size:12px}
.grp{display:flex;justify-content:space-between;align-items:center;padding:10px 4px 6px;font-weight:800;font-size:14px;border-top:1px solid var(--line);margin-top:6px}
.grp:first-child{border-top:0;margin-top:0}
.grp small{font-weight:400}
.crow{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;padding:7px 0;border-bottom:1px dashed var(--line)}
.crow:last-child{border-bottom:0}
.cname{background:none;border:0;text-align:right;padding:0;font-weight:500;min-width:0}
.cname small{display:block;font-size:12px}
input.asg{width:96px;padding:5px 8px;text-align:left;direction:ltr;border-radius:10px;font-variant-numeric:tabular-nums}
.pill{min-width:84px;text-align:center;border-radius:99px;padding:3px 10px;font-weight:700;font-size:13.5px;background:var(--surface2)}
.pill.ok{background:var(--ok-bg);color:var(--ok-fg)}.pill.warn{background:var(--warn-bg);color:var(--warn-fg)}.pill.bad{background:var(--bad-bg);color:var(--bad-fg)}
.mini{height:4px;border-radius:9px;background:var(--surface2);overflow:hidden;margin-top:3px}
.mini>i{display:block;height:100%;background:var(--accent);border-radius:9px}
.bar{height:9px;border-radius:99px;background:var(--surface2);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--c,var(--accent))}
.lbl-row{display:flex;justify-content:space-between;gap:8px;font-size:13.5px;align-items:center}
.catb{display:grid;gap:4px;padding:6px 0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.tile{background:var(--surface);border-radius:18px;padding:12px 14px;box-shadow:var(--shadow)}
.tile b{font-size:20px;display:block}
.seg{display:flex;background:var(--surface2);border-radius:14px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;border-radius:11px;padding:6px 8px;font-weight:500;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);font-weight:800;box-shadow:var(--shadow)}
.day{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);padding:12px 4px 4px}
.tx{display:flex;align-items:center;gap:10px;padding:10px 4px;border:0;border-top:1px solid var(--line);width:100%;background:none;text-align:right}
.tx .mid{flex:1;min-width:0}
.tx .mid div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.in-c{color:var(--in)}.out-c{color:var(--out)}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:10px;min-width:0}
.field>label{font-size:13px;color:var(--muted)}
.frow{display:flex;gap:8px}.frow>*{flex:1;min-width:0}
.nav{position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-left,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-right,0px));z-index:20}
.nav>div{max-width:820px;margin:0 auto;display:flex;gap:4px}
.nav button{flex:1;border:0;background:none;padding:6px 2px;border-radius:12px;font-size:12.5px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px}
.nav button.on{color:var(--accent);font-weight:800;background:var(--surface2)}
.nav svg{width:22px;height:22px}
.fab{position:fixed;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(78px + env(safe-area-inset-bottom,0px));z-index:21;width:58px;height:58px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);box-shadow:0 8px 20px rgba(0,0,0,.3);display:grid;place-items:center}
.fab svg{width:26px;height:26px;stroke-width:2.4}
.ovl{position:fixed;inset:0;background:rgba(6,10,24,.6);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:24px 24px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
.sheet h3{font-size:17px}
.acts{display:flex;gap:8px;margin-top:6px}.acts .btn{flex:1}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:99px;z-index:70;font-size:14px;max-width:90%}
.banner{background:var(--surface2);border-radius:14px;padding:10px 14px;display:flex;gap:10px;align-items:center;justify-content:space-between;font-size:13.5px}
.empty{text-align:center;padding:24px 10px;color:var(--muted)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{background:var(--surface2);border-radius:99px;padding:2px 12px;font-size:13px;border:0}
.chip.on{background:var(--accent);color:var(--accent-ink)}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
.lock{position:fixed;inset:0;z-index:100;background:linear-gradient(160deg,#0B1437,#0B4B57);color:#fff;display:grid;place-items:center;padding:20px}
.lock .box{width:100%;max-width:360px;display:flex;flex-direction:column;gap:12px;text-align:center}
.lock .brand{font-size:46px;color:#fff}
.lock input{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.3);color:#fff;text-align:center;font-size:18px;padding:12px}
.lock .btn{background:#fff;color:#0B1437;padding:12px}
.lock small{color:rgba(255,255,255,.75)}
.err{color:#FFB3C0;min-height:24px}
.meter{display:flex;gap:4px}.meter i{flex:1;height:5px;border-radius:9px;background:var(--surface2)}.meter i.on{background:var(--in)}
.status{font-size:12px;color:var(--muted);text-align:center;padding:6px}
svg text{fill:var(--muted);font-family:var(--font-body);font-size:10px}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:4px}
@media (prefers-reduced-motion:no-preference){.bar>i,.mini>i{transition:width .35s}}
</style>

/* ===== formatting ===== */

 ].map(function(g){return{id:g.id,name:g.name,cats:g.cats.map(function(c){return{id:c[0],name:c[1],kw:c[2],color:COL[0],target:null}})}})}

/* ===== crypto ===== */
var te=new TextEncoder(),td=new TextDecoder();
function b64(u){var s='',i;for(i=0;i<u.length;i+=8192)s+=String.fromCharCode.apply(null,u.subarray(i,i+8192));return btoa(s)}
function unb64(s){var b=atob(s),u=new Uint8Array(b.length),i;for(i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
var HAS_CRYPTO=!!(window.crypto&&crypto.subtle);
async function deriveKey(pw,salt,it){var k=await crypto.subtle.importKey('raw',te.encode(pw),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt:salt,iterations:it,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function encBlob(){
  if(!KEY)return JSON.stringify({v:2,enc:0,data:strip(S)});
  var iv=crypto.getRandomValues(new Uint8Array(12)),ct=await crypto.subtle.encrypt({name:'AES-GCM',iv:iv},KEY,te.encode(JSON.stringify(strip(S))));
  return JSON.stringify({v:2,enc:1,it:META.it,salt:b64(META.salt),iv:b64(iv),ct:b64(new Uint8Array(ct))})}
function strip(s){var c=JSON.parse(JSON.stringify(s));c.tx.forEach(function(t){delete t.mk});return c}
async function decBlob(b,pw){var salt=unb64(b.salt),key=await deriveKey(pw,salt,b.it),pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(b.iv)},key,unb64(b.ct));return{data:JSON.parse(td.decode(pt)),key:key,meta:{salt:salt,it:b.it}}}
function strength(pw){var s=0;if(pw.length>=8)s++;if(pw.length>=12)s++;if(/[a-z]/.test(pw)&&/[A-Z]/.test(pw))s++;if(/\d/.test(pw)&&/[^\dA-Za-z]|[a-zA-Z]/.test(pw))s++;return Math.min(4,s)}

/* ===== storage (db when signed in, localStorage otherwise) ===== */
var docRoot=null,saveTimer=null,saving=false,lastBlob='';
async function readBlob(){
  try{
    if(!window.claude)throw 0;
    var user=await window.claude.use('user'),id=user?await user.id():null,db=await window.claude.use('db');
    if(db&&id){docRoot=db.collection('data/users/'+id);storeMode='db';
      var snap=await docRoot.get(),parts={},n=0;snap.docs.forEach(function(d){var x=d.data();if(d.id==='bm')n=x.n;else if(/^b\d+$/.test(d.id))parts[+d.id.slice(1)]=x.s});
      if(n){var s='';for(var i=0;i<n;i++)s+=parts[i]||'';return s}
      return null}
  }catch(e){storeMode='local'}
  try{return localStorage.getItem('kisa-plus-v2')}catch(e){return null}}
async function writeBlob(blob){
  if(storeMode==='db'){var P=140000,n=Math.ceil(blob.length/P);
    for(var i=0;i<n;i++)await docRoot.doc('b'+i).set({s:blob.slice(i*P,(i+1)*P)});
    await docRoot.doc('bm').set({n:n,t:Date.now()});
    for(var j=n;j<n+6;j++){try{await docRoot.doc('b'+j).delete()}catch(e){break}}
  }else{localStorage.setItem('kisa-plus-v2',blob)}}
function queueSave(){clearTimeout(saveTimer);saveTimer=setTimeout(doSave,450)}
async function doSave(){
  if(!S||NEEDS_UNLOCK)return;if(saving){saveTimer=setTimeout(doSave,300);return}
  saving=true;var ok=true;
  try{var b=await encBlob();await writeBlob(b);lastBlob=b}catch(e){ok=false;toast('ذخیره نشد؛ دوباره تلاش می‌کنم');saveTimer=setTimeout(doSave,4000)}
  saving=false;var el=$('st');if(el)el.textContent=ok?stText():'ذخیره نشد'}
function stText(){return(storeMode==='db'?'ذخیره در حساب شما':'ذخیره فقط در همین مرورگر')+(KEY?' · رمزنگاری‌شده':'')}

/* ===== budget engine ===== */
function compute(sel){
  var min=sel,act={},inc={},incBefore=0,asgBefore=0;
  S.tx.forEach(function(t){min=Math.min(min,t.mk)});Object.keys(S.assigned).forEach(function(k){min=Math.min(min,+k)});
  min=Math.max(min,sel-72);
  S.tx.forEach(function(t){var b=base(t);if(t.cat==='rta'){inc[t.mk]=(inc[t.mk]||0)+b}else if(t.cat&&!t.tf){(act[t.mk]=act[t.mk]||{})[t.cat]=((act[t.mk]||{})[t.cat]||0)+b}});
  Object.keys(inc).forEach(function(k){if(+k<min)incBefore+=inc[k]});
  Object.keys(S.assigned).forEach(function(k){if(+k<min)Object.keys(S.assigned[k]).forEach(function(c){asgBefore+=S.assigned[k][c]})});
  var cats=allCats(),carry={},res={},incCum=incBefore,asgCum=asgBefore,lost=0;
  for(var m=min;m<=sel;m++){incCum+=inc[m]||0;
    cats.forEach(function(c){var asg=(S.assigned[m]||{})[c.id]||0,ac=(act[m]||{})[c.id]||0,cin=carry[c.id]||0,a=cin+asg+ac;asgCum+=asg;
      if(m<sel){if(a<0){lost+=-a;carry[c.id]=0}else carry[c.id]=a}else res[c.id]={assigned:asg,activity:ac,available:a,carryIn:cin}})}
  var under={};cats.forEach(function(c){var t=c.target,r=res[c.id],need=0;
    if(t&&t.amt>0){if(t.type==='monthly')need=Math.max(0,t.amt-r.assigned);else{var left=Math.max(1,t.mk-sel+1);need=Math.max(0,Math.ceil((t.amt-r.carryIn)/left)-r.assigned);if(r.carryIn>=t.amt)need=0}}
    r.need=need});
  return{rta:incCum-asgCum-lost,cats:res,inc:inc,act:act}}
function balances(){var b={};S.accounts.forEach(function(a){b[a.id]=0});S.tx.forEach(function(t){if(b[t.acc]!=null)b[t.acc]+=t.amt});return b}
function ageOfMoney(){
  var ins=S.tx.filter(function(t){return t.cat==='rta'&&base(t)>0}).sort(function(a,b){return a.d<b.d?-1:1}).map(function(t){return{d:dayNo(t.d),a:base(t)}});
  var outs=S.tx.filter(function(t){return t.cat&&t.cat!=='rta'&&!t.tf&&base(t)<0}).sort(function(a,b){return a.d<b.d?-1:1}),ages=[],qi=0;
  outs.forEach(function(t){var need=-base(t),dn=dayNo(t.d),wsum=0,w=0;
    while(need>0.001&&qi<ins.length){var take=Math.min(need,ins[qi].a);wsum+=take*(dn-ins[qi].d);w+=take;ins[qi].a-=take;need-=take;if(ins[qi].a<=0.001)qi++}
    if(w>0)ages.push(wsum/w)});
  var last=ages.slice(-10);return last.length?Math.round(last.reduce(function(a,b){return a+b},0)/last.length):null}

function parseQuick(text){
  var s=norm(text).toLowerCase(),o={amt:0,date:todayIso(),cat:null,note:'',cur:null},m;
  if(!s.trim())return null;
  var cm=[['USD',/(\$|usd|دالر|دلار)/],['EUR',/(€|eur|یورو)/],['PKR',/(pkr|کلدار|روپیه)/],['IRT',/(تومان|تومن)/],['AFN',/(afn|افغانی|افغ|؋)/]];
  for(var i=0;i<cm.length;i++){if(cm[i][1].test(s)){o.cur=cm[i][0];s=s.replace(cm[i][1],' ');break}}
  if(/پریروز/.test(s)){o.date=addDays(o.date,-2);s=s.replace('پریروز',' ')}else if(/دیروز/.test(s)){o.date=addDays(o.date,-1);s=s.replace('دیروز',' ')}else if((m=s.match(/(\d+)\s*روز\s*پیش/))){o.date=addDays(o.date,-(+m[1]));s=s.replace(m[0],' ')}
  s=s.replace('امروز',' ');
  var mult={'k':1e3,'هزار':1e3,'میلیون':1e6,'ملیون':1e6};
  m=s.match(/(\d+(?:\.\d+)?)\s*(k\b|هزار|میلیون|ملیون)?/);if(m){o.amt=parseFloat(m[1])*(m[2]?mult[m[2]]:1);s=s.replace(m[0],' ')}else if(/هزار/.test(s)){o.amt=1000;s=s.replace('هزار',' ')}
  o.note=s.replace(/\s+/g,' ').trim();
  var cs=allCats();for(var j=0;j<cs.length;j++){if(cs[j].kw&&new RegExp(cs[j].kw).test(norm(text))){o.cat=cs[j].id;break}}
  if(!o.cat)for(var k=0;k<cs.length;k++){if(norm(text).indexOf(cs[k].name)>=0){o.cat=cs[k].id;break}}
  return o}

    if(dl){await dl.save({filename:name,data:data})}
    else{var b=new Blob([data],{type:'text/plain;charset=utf-8'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(u)},4000)}
    toast('فایل آماده شد')}catch(e){if(!e||e.code!=='declined')toast('ذخیرهٔ فایل انجام نشد')}}

document.addEventListener('click',async function(e){
  var el=e.target.closest('[data-act]');if(!el||!S)return;
  var a=el.dataset.act,v=el.dataset.v,id=el.dataset.id;
  switch(a){
  case 'tab':UI.tab=v;render();window.scrollTo(0,0);break;
  case 'hide':UI.hide=!UI.hide;render();break;
  case 'mnav':UI.mk+=+v;render();break;
  case 'more':UI.more=v;render();break;
  case 'accf':UI.acc=v;UI.lim=60;render();break;
  case 'more-tx':UI.lim+=60;render();break;
  case 'close':closeModal();break;
  case 'lock':lockNow();break;
  case 'clear-demo':S=newState();derive();queueSave();render();toast('شروع تازه. اول یک حساب بساز.');break;
  case 'add-acc':openModal({kind:'acc'});break;
  case 'save-acc':var an=$('a-name').value.trim();if(!an){toast('نام حساب را بنویس');return}
    var na={id:'a'+uid(),name:an,type:$('a-type').value,cur:$('a-cur').value};S.accounts.push(na);var bal=pnum($('a-bal').value);
    if(bal)S.tx.push({id:uid(),d:todayIso(),acc:na.id,cat:'rta',amt:bal,payee:'مانده اولیه',note:''});
    derive();queueSave();closeModal();UI.tab='acc';render();toast('حساب ساخته شد');break;
  case 'add-tx':var t0=newTx();openModal({kind:'tx',kind2:'out',tx:t0});break;
  case 'edit-tx':var tx=S.tx.find(function(x){return x.id===id});if(tx)openModal({kind:'tx',kind2:tx.cat==='rta'?'in':'out',tx:Object.assign({},tx)});break;
  case 'f-kind':M.kind2=v;document.querySelectorAll('[data-act=f-kind]').forEach(function(b){b.classList.toggle('on',b.dataset.v===v)});
    $('w-cat').hidden=v!=='out';$('w-to').hidden=v!=='tf';$('w-pay').hidden=v==='tf';$('l-acc').textContent=v==='tf'?'از حساب':'حساب';break;
  case 'save-tx':
    var amt=Math.abs(pnum($('f-amt').value));if(amt<=0){toast('مبلغ را درست وارد کن');return}
    var d=readDate('f'),acc=$('f-acc').value,pay=$('f-pay').value.trim(),note=$('f-note').value.trim(),k2=M.kind2;
    if(k2==='tf'){var to=$('f-to').value;if(to===acc){toast('دو حساب باید فرق داشته باشند');return}
      var A=accOf(acc),B=accOf(to),tid=uid(),got=amt*rate(A.cur)/rate(B.cur);
      S.tx.push({id:uid(),d:d,acc:acc,cat:null,amt:-amt,payee:'',note:note,tf:tid},{id:uid(),d:d,acc:to,cat:null,amt:Math.round(got*100)/100,payee:'',note:note,tf:tid})}
    else{var rec={id:M.tx.id||uid(),d:d,acc:acc,cat:k2==='in'?'rta':$('f-cat').value,amt:k2==='in'?amt:-amt,payee:pay,note:note};
      if(M.tx.id){var i=S.tx.findIndex(function(x){return x.id===M.tx.id});S.tx[i]=rec}else S.tx.push(rec)}
    derive();queueSave();UI.mk=mkOf(d);closeModal();render();toast('ثبت شد');break;
  case 'del-tx':if(!el.dataset.sure){el.dataset.sure='1';el.textContent='مطمئنی؟ دوباره بزن';return}
    var tt=M.tx;S.tx=S.tx.filter(function(x){return tt.tf?x.tf!==tt.tf:x.id!==tt.id});queueSave();closeModal();render();toast('حذف شد');break;
  case 'cat':openModal({kind:'cat',id:id});break;
  case 'save-cat':var ty=$('c-type').value,ca=catOf(M.id),am=pnum($('c-amt').value);
    ca.target=ty==='none'||am<=0?null:(ty==='monthly'?{type:'monthly',amt:am}:{type:'goal',amt:am,mk:MK(+$('c-y').value,+$('c-m').value)});
    queueSave();closeModal();render();break;
  case 'move':if(!S.accounts.length){toast('اول یک حساب بساز');return}openModal({kind:'move'});break;
  case 'save-move':var fr=$('m-from').value,to2=$('m-to').value,ma=pnum($('m-amt').value);if(!ma||fr===to2){toast('مبلغ و دو دستهٔ متفاوت لازم است');return}
    var cc=compute(UI.mk);setAssigned(fr,(cc.cats[fr].assigned)-ma);setAssigned(to2,(cc.cats[to2].assigned)+ma);queueSave();closeModal();render();toast('جابه‌جا شد');break;
  case 'auto-assign':var c3=compute(UI.mk),cnt=0;allCats().forEach(function(cat){var r=c3.cats[cat.id];if(r.need>0.5){setAssigned(cat.id,r.assigned+Math.ceil(r.need));cnt++}});
    if(!cnt){toast('همهٔ هدف‌ها پر هستند');return}queueSave();render();toast('هدف '+fa(cnt)+' دسته تخصیص یافت');break;
  case 'add-cat':var cn=$('nc-n').value.trim();if(!cn)return;S.groups.find(function(g){return g.id===$('nc-g').value}).cats.push({id:'c'+uid(),name:cn,kw:'',color:COL[allCats().length%COL.length],target:null});queueSave();render();break;
  case 'add-grp':var gn=$('ng-n').value.trim();if(!gn)return;S.groups.push({id:'g'+uid(),name:gn,cats:[]});queueSave();render();break;
  case 'set-pw':
    var p1=$('pw1').value,p2v=$('pw2').value;if(p1.length<8){toast('رمز دست‌کم ۸ نویسه باشد');return}if(p1!==p2v){toast('دو رمز یکی نیست');return}
    el.disabled=true;el.textContent='در حال رمزنگاری…';
    try{var salt=crypto.getRandomValues(new Uint8Array(16));META={salt:salt,it:310000};KEY=await deriveKey(p1,salt,META.it);await doSaveNow();armIdle();render();toast('قفل فعال شد')}catch(x){KEY=null;META=null;toast('فعال‌سازی ناموفق بود');render()}break;
  case 'rm-pw':if(!el.dataset.sure){el.dataset.sure='1';el.textContent='مطمئنی؟ اطلاعات بدون رمز ذخیره می‌شود';return}
    KEY=null;META=null;clearTimeout(idleT);await doSaveNow();render();toast('قفل برداشته شد');break;
  case 'exp-csv':exportCsv();break;
  case 'exp-json':saveFile('kisa-plus-backup.json',await encBlob());break;
  case 'imp':try{var b=JSON.parse($('imp').value);
      if(b.enc){var pw=$('imp-pw').value;if(!pw){toast('رمز پشتیبان را بنویس');return}var r=await decBlob(b,pw);S=r.data;KEY=r.key;META=r.meta}else{S=b.data;KEY=null;META=null}
      derive();await doSaveNow();armIdle();render();toast('بازیابی شد')}catch(x){toast('پشتیبان یا رمز درست نیست')}break;
  case 'wipe':if(!el.dataset.sure){el.dataset.sure='1';el.textContent='مطمئنی؟ دوباره بزن';return}
    S=newState();KEY=null;META=null;derive();await doSaveNow();render();toast('همه‌چیز پاک شد');break;
  }});
async function doSaveNow(){clearTimeout(saveTimer);var w=0;while(saving&&w++<50)await new Promise(function(r){setTimeout(r,100)});saving=true;
  try{var b=await encBlob();await writeBlob(b)}finally{saving=false}}
document.addEventListener('input',function(e){
  var t=e.target;
  if(t.id==='pw1'){var s=strength(t.value),m=document.querySelectorAll('#meter i');m.forEach(function(x,i){x.classList.toggle('on',i<s)})}
  else if(t.id==='f-quick'){var q=parseQuick(t.value);if(!q)return;if(q.amt){var A=accOf($('f-acc').value),f=q.cur&&A?rate(q.cur)/rate(A.cur):1;$('f-amt').value=fa(Math.round(q.amt*f*100)/100)}
    setDate('f',q.date);if(q.cat&&M.kind2==='out')$('f-cat').value=q.cat;$('f-pay').value=q.note}});
document.addEventListener('change',function(e){
  var t=e.target;
  if(t.dataset.as){var v=pnum(t.value);setAssigned(t.dataset.as,Math.max(0,v));queueSave();render()}
  else if(t.dataset.rate){var r=pnum(t.value);if(r>0){S.settings.rates[t.dataset.rate]=r;queueSave();toast('نرخ ذخیره شد')}}
  else if(t.dataset.set){S.settings[t.dataset.set]=+t.value;if(t.dataset.set==='lockOnHide')S.settings.lockOnHide=t.value==='1';queueSave();armIdle()}
  else if(t.dataset.dsel){setDate(t.dataset.dsel,gIso(+$(t.dataset.dsel+'-y').value,+$(t.dataset.dsel+'-m').value,Math.min(+$(t.dataset.dsel+'-d').value,mlen(+$(t.dataset.dsel+'-y').value,+$(t.dataset.dsel+'-m').value))))}});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&M)closeModal();if(e.key==='Enter'&&e.target.dataset&&e.target.dataset.as)e.target.blur()});

boot();
})();
